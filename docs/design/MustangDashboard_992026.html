<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030506">
  <title>Mustang Digital Dashboard</title>
  <meta name="description" content="A responsive Mustang-inspired digital instrument cluster.">
  <style>
    :root {
      color-scheme: dark;
      --ice: #e8edf2;
      --muted: #a9afb5;
      --blue: #008cff;
      --blue-hot: #25c1ff;
      --red: #ec1a11;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Bahnschrift", "DIN Alternate", "Arial Narrow", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .cluster {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 48%, #111820 0%, #070a0d 47%, #000 88%);
      isolation: isolate;
    }

    .cluster::after {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(112deg, transparent 17%, rgba(255,255,255,.035) 27%, transparent 38%),
        radial-gradient(ellipse at 50% 50%, transparent 54%, rgba(0,0,0,.72) 100%);
      mix-blend-mode: screen;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    text {
      fill: var(--ice);
      font-family: inherit;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .label {
      fill: #c6cbd0;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .small {
      fill: #aeb4ba;
      font-size: 17px;
      letter-spacing: .5px;
    }

    .tick {
      stroke: #bbc2c8;
      stroke-linecap: square;
    }

    .tick.minor { opacity: .66; }
    .tick.red { stroke: var(--red); }

    .value-shadow {
      filter: url(#textShadow);
    }

    .metal-value {
      fill: url(#silverText);
    }

    .muted-text {
      fill: #aeb4ba;
    }

    .drive-text {
      fill: #ec1a11;
    }

    .blue-glow {
      filter: url(#blueGlow);
    }

    .boot {
      animation: clusterBoot 1s cubic-bezier(.2,.75,.25,1) both;
    }

    .boot-delay {
      animation: clusterBoot 1.2s .18s cubic-bezier(.2,.75,.25,1) both;
    }

    @keyframes clusterBoot {
      from { opacity: 0; transform: scale(.992); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot,
      .boot-delay { animation: none; }
    }
  </style>
</head>
<body>
  <main class="cluster" aria-label="Mustang digital instrument cluster">
    <svg id="dashboard" viewBox="0 0 1920 720" preserveAspectRatio="xMidYMid meet"

  <script>
    (() => {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const state = {
        speed: 55,
        rpm: 4500,
        gear: 4,
        drive: "D",
        transTemp: 178,
        oilPressure: 58,
        engineTemp: 220,
        coolant: 58,
        fuel: 72,
        odometer: 12345.6,
        range: 289
      };

      const polar = (cx, cy, r, degrees) => {
        const radians = degrees * Math.PI / 180;
        return { x: cx + r * Math.cos(radians), y: cy + r * Math.sin(radians) };
      };

      const arcPath = (cx, cy, r, start, end) => {
        const a = polar(cx, cy, r, start);
        const b = polar(cx, cy, r, end);
        const sweep = Math.max(0, end - start);
        return "M " + a.x.toFixed(2) + " " + a.y.toFixed(2) +
          " A " + r + " " + r + " 0 " + (sweep > 180 ? 1 : 0) +
          " 1 " + b.x.toFixed(2) + " " + b.y.toFixed(2);
      };

      const svgNode = (name, attributes = {}) => {
        const node = document.createElementNS(SVG_NS, name);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      };

      function buildSpeedTicks() {
        const group = document.getElementById("speedTicks");
        for (let value = 0; value <= 160; value += 2) {
          const angle = 135 + (value / 160) * 270;
          const major = value % 20 === 0;
          const medium = value % 10 === 0;
          const outer = polar(1480, 360, 214, angle);
          const inner = polar(1480, 360, major ? 190 : medium ? 196 : 201, angle);
          group.append(svgNode("line", {
            x1: inner.x, y1: inner.y, x2: outer.x, y2: outer.y,
            class: "tick " + (major ? "" : "minor"),
            "stroke-width": major ? 3 : medium ? 2 : 1.4
          }));
          if (major) {
            const label = polar(1480, 360, 169, angle);
            const text = svgNode("text", {
              x: label.x,
              y: label.y + 10,
              "text-anchor": "middle",
              "font-size": "34",
              fill: "#cbd0d4"
            });
            text.textContent = value;
            group.append(text);
          }
        }
      }

      function buildTachTicks() {
        const path = document.getElementById("tachRim");
        const group = document.getElementById("tachTicks");
        const length = path.getTotalLength();

        for (let step = 0; step <= 90; step += 1) {
          const offset = length * (step / 90);
          const p = path.getPointAtLength(offset);
          const before = path.getPointAtLength(Math.max(0, offset - 1.5));
          const after = path.getPointAtLength(Math.min(length, offset + 1.5));
          const dx = after.x - before.x;
          const dy = after.y - before.y;
          const magnitude = Math.hypot(dx, dy) || 1;
          const nx = -dy / magnitude;
          const ny = dx / magnitude;
          const major = step % 10 === 0;
          const medium = step % 5 === 0;
          const red = step >= 75;
          const start = major ? 7 : 5;
          const end = major ? 29 : medium ? 21 : 14;
          group.append(svgNode("line", {
            x1: p.x + nx * start,
            y1: p.y + ny * start,
            x2: p.x + nx * end,
            y2: p.y + ny * end,
            class: "tick " + (major ? "" : "minor") + (red ? " red" : ""),
            "stroke-width": major ? 2.5 : medium ? 2 : 1.2
          }));

          if (major && step >= 20 && step <= 80) {
            const text = svgNode("text", {
              x: p.x + nx * 58,
              y: p.y + ny * 58 + 9,
              "text-anchor": "middle",
              "font-size": "34",
              style: "fill:" + (red ? "#df1710" : "#cbd0d4")
            });
            text.textContent = step / 10;
            group.append(text);
          }
        }
      }

      function buildSmallGauge(prefix, min, max, value) {
        const centers = { trans: [705, 397], oil: [913, 397], engine: [1121, 397] };
        const center = centers[prefix];
        const cx = center[0];
        const cy = center[1];
        const start = 135;
        const end = 405;
        const percent = Math.max(0, Math.min(1, (value - min) / (max - min)));
        document.getElementById(prefix + "Track").setAttribute("d", arcPath(cx, cy, 65, start, end));
        document.getElementById(prefix + "Fill").setAttribute("d", arcPath(cx, cy, 65, start, start + 270 * percent));
        document.getElementById(prefix + "Hot").setAttribute("d", arcPath(cx, cy, 76, 372, 405));

        const group = document.getElementById(prefix + "Ticks");
        if (!group.childNodes.length) {
          for (let i = 0; i <= 18; i += 1) {
            const angle = start + i * 15;
            const p1 = polar(cx, cy, i % 3 === 0 ? 54 : 57, angle);
            const p2 = polar(cx, cy, 65, angle);
            group.append(svgNode("line", {
              x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
              stroke: i >= 16 ? "#ec1a11" : "#c4cad0",
              "stroke-opacity": i % 3 === 0 ? ".95" : ".68",
              "stroke-width": i % 3 === 0 ? "2" : "1.2"
            }));
          }
        }
      }

      function updateMarkerOnPath(path, marker, ratio, length = 43) {
        const total = path.getTotalLength();
        const offset = Math.max(0, Math.min(total, total * ratio));
        const p = path.getPointAtLength(offset);
        const before = path.getPointAtLength(Math.max(0, offset - 2));
        const after = path.getPointAtLength(Math.min(total, offset + 2));
        const dx = after.x - before.x;
        const dy = after.y - before.y;
        const magnitude = Math.hypot(dx, dy) || 1;
        const nx = -dy / magnitude;
        const ny = dx / magnitude;
        marker.setAttribute("x1", p.x - nx * 2);
        marker.setAttribute("y1", p.y - ny * 2);
        marker.setAttribute("x2", p.x + nx * length);
        marker.setAttribute("y2", p.y + ny * length);
      }

      function render(next = state) {
        Object.assign(state, next);

        const speed = Math.max(0, Math.min(160, Number(state.speed) || 0));
        const rpm = Math.max(0, Math.min(9000, Number(state.rpm) || 0));
        const speedRatio = speed / 160;
        const rpmRatio = rpm / 9000;
        const speedAngle = 135 + 270 * speedRatio;

        document.getElementById("speedArc").setAttribute("d", arcPath(1480, 360, 205, 135, speedAngle));
        const speedInner = polar(1480, 360, 181, speedAngle);
        const speedOuter = polar(1480, 360, 229, speedAngle);
        const speedMarker = document.getElementById("speedMarker");
        speedMarker.setAttribute("x1", speedInner.x);
        speedMarker.setAttribute("y1", speedInner.y);
        speedMarker.setAttribute("x2", speedOuter.x);
        speedMarker.setAttribute("y2", speedOuter.y);

        const tachFill = document.getElementById("tachFill");
        tachFill.setAttribute("stroke-dasharray", (rpmRatio * 1000).toFixed(2) + " 1000");
        updateMarkerOnPath(document.getElementById("tachRim"), document.getElementById("tachMarker"), rpmRatio);

        document.getElementById("speedValue").textContent = Math.round(speed);
        document.getElementById("gearValue").textContent = state.gear;
        document.getElementById("driveValue").textContent = state.drive;
        document.getElementById("odometerValue").textContent =
          String(Number(state.odometer).toFixed(1)).padStart(8, "0");
        document.getElementById("rangeValue").textContent = Math.round(state.range);

        const coolant = Math.max(0, Math.min(100, Number(state.coolant) || 0));
        const fuel = Math.max(0, Math.min(100, Number(state.fuel) || 0));
        document.getElementById("coolantArc").setAttribute("stroke-dasharray", coolant + " 100");
        document.getElementById("fuelArc").setAttribute("stroke-dasharray", fuel + " 100");

        buildSmallGauge("trans", 100, 300, Number(state.transTemp));
        buildSmallGauge("oil", 0, 100, Number(state.oilPressure));
        buildSmallGauge("engine", 140, 340, Number(state.engineTemp));

        document.getElementById("speedometer")
          .setAttribute("aria-label", "Speed " + Math.round(speed) + " miles per hour");
        document.getElementById("engineGauge")
          .setAttribute("aria-label", "Engine temperature " + Math.round(state.engineTemp) + " degrees Fahrenheit");
        document.getElementById("transGauge")
          .setAttribute("aria-label", "Transmission temperature " + Math.round(state.transTemp) + " degrees Fahrenheit");
        document.getElementById("status").value =
          Math.round(speed) + " miles per hour, " + Math.round(rpm) + " RPM, gear " + state.gear;
      }

      function animateStartup() {
        const target = { ...state };
        const start = performance.now();
        const duration = 1250;
        const frame = now => {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          render({
            ...target,
            speed: target.speed * eased,
            rpm: target.rpm * eased
          });
          if (t < 1) requestAnimationFrame(frame);
          else render(target);
        };
        requestAnimationFrame(frame);
      }

      buildSpeedTicks();
      buildTachTicks();
      render();
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) render();
      else animateStartup();

      window.MustangDashboard = {
        update(values) { render(values); },
        getState() { return { ...state }; }
      };

      window.addEventListener("keydown", event => {
        if (event.key === "ArrowUp") render({ speed: Math.min(160, state.speed + 1) });
        if (event.key === "ArrowDown") render({ speed: Math.max(0, state.speed - 1) });
      });
    })();
  </script>
</body>
</html>
